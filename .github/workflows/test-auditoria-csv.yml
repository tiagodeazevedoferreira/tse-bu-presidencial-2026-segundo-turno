name: Teste da auditoria do CSV

on:
  push:
    branches:
      - feat/auditoria-base-radar-anomalias
  pull_request:
    branches:
      - main

jobs:
  test-auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar testes
        run: python -m unittest discover -s tests -v

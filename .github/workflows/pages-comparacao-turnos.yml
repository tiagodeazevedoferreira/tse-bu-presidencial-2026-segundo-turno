name: Publicar dashboard de comparação entre turnos

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/**"
      - "data/dashboard/**"
      - "data/NovoArquivoDashboard.csv"
      - "DASHBOARD_COMPARACAO_TURNOS.md"
      - ".github/workflows/pages-comparacao-turnos.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site estático
        run: |
          mkdir -p site/data/dashboard site/data
          cp index.html site/index.html
          if [ -f data/NovoArquivoDashboard.csv ]; then
            cp data/NovoArquivoDashboard.csv site/data/
            echo "NovoArquivoDashboard.csv encontrado e incluído no site."
          else
            echo "::error::data/NovoArquivoDashboard.csv não foi encontrado."
            exit 1
          fi

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

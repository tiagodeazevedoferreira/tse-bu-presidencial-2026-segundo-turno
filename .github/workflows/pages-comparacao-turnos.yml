name: Publicar dashboard de comparação entre turnos

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/**"
      - "data/dashboard/**"
      - "DASHBOARD_COMPARACAO_TURNOS.md"
      - ".github/workflows/pages-comparacao-turnos.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site estático
        run: |
          mkdir -p site/data/dashboard
          cp index.html site/index.html
          if [ -f data/dashboard/votos_turnos_2026.json.gz ]; then
            cp data/dashboard/votos_turnos_2026.json.gz site/data/dashboard/
            echo "Dados compactados encontrados."
          else
            echo "::warning::data/dashboard/votos_turnos_2026.json.gz ainda não existe; o painel exibirá um aviso de dados ausentes."
          fi

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
